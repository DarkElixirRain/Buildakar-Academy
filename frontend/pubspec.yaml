name: buildacad
description: A Coursera-like learning app
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.1.0
  flutter_secure_storage: ^10.3.1
  provider: ^6.1.5+1
  http: ^1.1.0
  shared_preferences: ^2.5.5
  json_annotation: ^4.12.0
  speech_to_text: ^7.4.0
  youtube_player_flutter: ^10.0.1
  video_player: ^2.11.1
  chewie: ^1.14.1
  intl: ^0.20.3
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  share_plus: ^13.2.0
  image_picker: ^1.2.3
  # Use the official Jitsi Meet SDK
  jitsi_meet_flutter_sdk: ^12.1.3
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/favicon.png
    - assets/white_favicon.png