<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Google Sign-In -->
  <meta name="google-signin-client_id" content="743824025812-73jkos8mjp03muupgkuj9h24p4chh7hk.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="buildacad">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>buildacad</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Google Sign-In credential callback handler
    window.gisCredentialCallback = null;

    window.handleGisCredential = function(response) {
      if (window.gisCredentialCallback) {
        window.gisCredentialCallback(response.credential);
      }
    };

    window.initGoogleSignIn = function(clientId) {
      google.accounts.id.initialize({
        client_id: clientId,
        callback: window.handleGisCredential,
      });
    };

    window.promptGoogleSignIn = function() {
      google.accounts.id.prompt();
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
