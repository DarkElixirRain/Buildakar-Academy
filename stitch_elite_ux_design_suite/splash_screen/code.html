<style>
        @keyframes scaleFadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .animate-logo {
            animation: scaleFadeIn 400ms ease-out forwards;
        }

        .animate-wordmark {
            opacity: 0;
            animation: slideUpFade 500ms ease-out 400ms forwards;
        }

        .animate-tagline {
            opacity: 0;
            animation: slideUpFade 500ms ease-out 700ms forwards;
        }

        .progress-line {
            height: 2px;
            width: 0%;
            background-color: #3B82F6;
            animation: progressFill 2500ms cubic-bezier(0.65, 0, 0.35, 1) 200ms forwards;
        }

        .radial-glow {
            background: radial-gradient(circle, rgba(59, 130, 246, 0.04) 0%, rgba(11, 18, 32, 0) 70%);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-brand-navy m-0 p-0 overflow-hidden h-screen flex flex-col items-center justify-center">

<div class="absolute inset-0 radial-glow pointer-events-none z-0"></div>

                BuildAcad
            </h1>
<p class="font-body-md text-body-md text-slate-custom animate-tagline">
                Learn. Build. Achieve.
            </p>
</div>
</main>
<!-- Bottom Progress Section -->
<footer class="absolute bottom-16 left-0 right-0 px-12 md:px-32 lg:px-64">
<div class="w-full bg-white/5 rounded-full overflow-hidden">
<div class="progress-line rounded-full"></div>
</div>
<!-- Optional micro-hint -->
<div class="mt-4 flex justify-center opacity-20">
<span class="font-label-caps text-label-caps text-white">Initializing Platform</span>
</div>
</footer>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Optional: Auto-transition logic after splash
            const splashDuration = 3200; // Total expected time for full progress
            
            setTimeout(() => {
                // Here you would typically redirect or switch views
                console.log("Splash sequence complete. Transitioning to main app...");
            }, splashDuration);

            // Adding a little hover sparkle effect logic for later reuse if needed
            window.addEventListener('mousemove', (e) => {
                const glow = document.querySelector('.radial-glow');
                const x = (e.clientX / window.innerWidth) * 100;
                const y = (e.clientY / window.innerHeight) * 100;
                // Subtle follow effect (kept extremely faint per request)
                glow.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(59, 130, 246, 0.05) 0%, rgba(11, 18, 32, 0) 60%)`;
            });
        });
    </script>
